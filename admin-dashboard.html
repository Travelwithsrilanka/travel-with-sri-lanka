<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="robots" content="noindex,nofollow"> <title> Admin Dashboard | Travel With Sri Lanka </title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, Helvetica, sans-serif; background: #f7f8f7; color: #17221d; min-height: 100vh; } .adminHeader { background: #17221d; color: #fff; padding: 20px; } .adminHeaderInner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; } .adminLogo { font-size: 18px; font-weight: 700; letter-spacing: 1px; } .adminLogo span { display: block; color: #c8a96b; font-size: 11px; letter-spacing: 2px; margin-top: 5px; } .logoutBtn { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; padding: 9px 16px; border-radius: 6px; cursor: pointer; } .logoutBtn:hover { background: rgba(255,255,255,.1); } .adminMain { max-width: 1100px; margin: 35px auto; padding: 0 20px; } .dashboardHead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 25px; } .dashboardHead h1 { margin-bottom: 6px; } .dashboardHead p { color: #68736d; } .reviewCount { background: #fff; border: 1px solid #e0e5e2; padding: 10px 16px; border-radius: 20px; white-space: nowrap; } .reviewsList { display: grid; gap: 18px; } .reviewCard { background: #fff; border: 1px solid #e0e5e2; border-radius: 10px; padding: 22px; } .reviewTop { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; } .reviewName { font-weight: 700; font-size: 17px; } .reviewCountry { color: #68736d; font-size: 14px; margin-top: 4px; } .stars { color: #c8a96b; font-size: 18px; white-space: nowrap; } .reviewText { margin-top: 15px; line-height: 1.7; color: #35413b; } .reviewPhoto { width: 180px; height: 180px; object-fit: cover; border-radius: 8px; margin-top: 15px; display: block; } .reviewDate { display: block; margin-top: 12px; color: #8a948f; font-size: 12px; } .deleteBtn { margin-top: 15px; padding: 9px 15px; border: 1px solid #d9534f; background: #fff; color: #c0392b; border-radius: 5px; cursor: pointer; } .deleteBtn:hover { background: #fff1f0; } .loading, .empty { background: #fff; border: 1px solid #e0e5e2; border-radius: 10px; padding: 35px; text-align: center; color: #68736d; } @media (max-width: 650px) { .adminHeaderInner { align-items: flex-start; flex-direction: column; } .logoutBtn { width: 100%; } .dashboardHead { align-items: flex-start; flex-direction: column; } .reviewTop { flex-direction: column; } .reviewPhoto { width: 100%; height: 220px; } } </style> </head> <body> <header class="adminHeader"> <div class="adminHeaderInner"> <div class="adminLogo"> TRAVEL WITH SRI LANKA <span> ADMIN DASHBOARD </span> </div> <button type="button" id="logoutBtn" class="logoutBtn"> Logout </button> </div> </header> <main class="adminMain"> <div class="dashboardHead"> <div> <h1> Traveller Reviews </h1> <p> Manage reviews submitted by travellers. </p> </div> <div id="reviewCount" class="reviewCount"> 0 Reviews </div> </div> <div id="reviewsList" class="reviewsList"> <div class="loading"> Loading reviews... </div> </div> </main> <script type="module" src="admin-dashboard.js"> </script> </body> </html>
