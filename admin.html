<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="robots" content="noindex,nofollow"> <title> Admin | Travel With Sri Lanka </title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, Helvetica, sans-serif; background: #f7f8f7; color: #17221d; min-height: 100vh; padding: 30px 20px; } .adminBox { max-width: 500px; margin: 60px auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,.08); } .adminBox h1 { margin-bottom: 10px; } .adminIntro { color: #68736d; margin-bottom: 25px; line-height: 1.6; } .formGroup { margin-bottom: 18px; } .formGroup label { display: block; margin-bottom: 7px; font-weight: 600; } .formGroup input { width: 100%; padding: 13px; border: 1px solid #d7ddd9; border-radius: 6px; font-size: 15px; outline: none; } .formGroup input:focus { border-color: #17221d; } #loginBtn { width: 100%; padding: 13px; border: none; border-radius: 6px; background: #17221d; color: #fff; font-size: 15px; cursor: pointer; } #loginBtn:disabled { opacity: .6; cursor: not-allowed; } #loginMessage { margin-top: 15px; font-size: 14px; } .error { color: #c0392b; } .success { color: #18794e; } </style> </head> <body> <div class="adminBox"> <h1> Travel With Sri Lanka </h1> <p class="adminIntro"> Admin login — manage traveller reviews and website content. </p> <form id="adminLoginForm"> <div class="formGroup"> <label for="adminEmail"> Email </label> <input type="email" id="adminEmail" placeholder="Admin email" autocomplete="username" required> </div> <div class="formGroup"> <label for="adminPassword"> Password </label> <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required> </div> <button type="submit" id="loginBtn"> Login </button> <p id="loginMessage"> </p> </form> </div> <script type="module" src="admin.js"> </script> </body> </html>
